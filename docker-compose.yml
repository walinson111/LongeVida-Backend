# PostgreSQL local opcional (alternativa a instalar o PostgreSQL no computador).
# Uso (dentro de backend/):  docker compose up -d
# A senha vem de DB_PASSWORD (arquivo backend/.env); não há senha neste arquivo.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: longevida
      POSTGRES_USER: ${DB_USERNAME:-longevida}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - longevida-db:/var/lib/postgresql/data
volumes:
  longevida-db:
