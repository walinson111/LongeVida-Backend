# Configuração do LongeVida API.
# Nenhuma credencial fica neste arquivo: tudo vem de variáveis de ambiente.
# Veja backend/.env.example e o README.md.

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: longevida-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/longevida}
    username: ${DB_USERNAME:longevida}
    password: ${DB_PASSWORD}          # obrigatória (sem valor padrão de propósito)
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate              # o esquema é criado pelo Flyway; o Hibernate só confere
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  jwt:
    secret: ${JWT_SECRET}             # obrigatória: Base64 de pelo menos 32 bytes
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}   # 7 dias
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  mail:
    enabled: ${MAIL_ENABLED:false}    # true exige SPRING_MAIL_HOST etc. (ver README)
    from: ${MAIL_FROM:no-reply@longevida.local}
    log-codigo: false                 # só o perfil "dev" ativa (nunca em produção)
  password-reset:
    expiration-minutes: 15
    max-attempts: 5
  atividade:
    kcal-por-exercicio: 50            # estimativa simples herdada do protótipo
  scheduler:
    enabled: true

logging:
  level:
    root: INFO
